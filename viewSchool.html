  <script>
    // Function to fetch school data from the server
    async function fetchSchoolData() {
        try {
            // Fetch data from the API
            let response = await fetch("http://localhost:8080/get-school"); // API endpoint
            if (!response.ok) {
                throw new Error("Network response was not ok");
            }
            let data = await response.json(); // Parsing JSON response

            // Check if data is returned
            if (Array.isArray(data) && data.length > 0) {
                // Get the table body element
                let tableBody = document.querySelector("#schoolTable tbody");

                // Clear any existing rows in the table
                tableBody.innerHTML = "";

                // Iterate over the data array and populate the table
                data.forEach(school => {
                    let row = document.createElement("tr"); // Create a new row

                    // Create table cells for each data field
                    let idCell=document.createElement("td");
                    idCell.textContent=school.id;
                    row.appendChild(idCell);

                    let nameCell = document.createElement("td");
                    nameCell.textContent = school.name;
                    row.appendChild(nameCell);

                    let addressCell = document.createElement("td");
                    addressCell.textContent = school.address;
                    row.appendChild(addressCell);

                    let contactCell = document.createElement("td");
                    contactCell.textContent = school.mobile;  // Change this field if needed
                    row.appendChild(contactCell);

                    let emailCell = document.createElement("td");
                    emailCell.textContent = school.email;
                    row.appendChild(emailCell);

                    let cityCell = document.createElement("td");
                    cityCell.textContent = school.city;
                    row.appendChild(cityCell);

                    // Append the row to the table body
                    tableBody.appendChild(row);
                });
            } else {
                console.log("No school data found.");
            }
        } catch (error) {
            console.error("Error fetching school data: ", error);
        }
    }

    // Call the fetchSchoolData function when the page loads
    window.onload = fetchSchoolData;
</script>
