  <!--script for this page-->
  <script>
   function submitMeal() {
    const schoolName = sessionStorage.getItem("schoolName");

    if (!schoolName) {
        alert("Session expired or school not logged in. Please log in again.");
        window.location.href = "home.html";
        return;
    }

    const foodItem = document.getElementById("name").value;
    const quantity = document.getElementById("quantity").value;
    const measure = document.getElementById("measure").value;

    if (foodItem === 'Select' || !quantity || measure === 'Select') {
        alert("Please fill in all the required fields.");
        return;
    }

    const mealData = {
        food_Item: foodItem,
        quentity: parseInt(quantity, 10),
        measure: measure,
        school_Name: schoolName
    };

    fetch("http://localhost:8080/add-meal", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(mealData)
    })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Meal added successfully!");
                document.getElementById("name").value = 'Select';
                document.getElementById("quantity").value = '';
                document.getElementById("measure").value = 'Select';
            } else {
                alert("Failed to add meal. Please try again.");
            }
        })
        .catch(error => {
            console.error("Error adding meal:", error);
            alert("There was an error adding the meal. Please try again later.");
        });
}

 


    
  </script>
