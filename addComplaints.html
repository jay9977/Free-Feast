  <script>
    function submitComplaint() {
    const schoolName = sessionStorage.getItem("schoolName");

    if (!schoolName) {
        alert("Session expired or school not logged in. Please log in again.");
        window.location.href = "home.html";
        return;
    }

    const complaint = document.getElementById("name").value;
    const date = document.getElementById("date").value;

    if (!complaint || !date) {
        alert("Please fill in all the required fields.");
        return;
    }

    const complaintData = {
        complaint: complaint,
        date: date,
        schoolName: schoolName
    };

    fetch("http://localhost:8080/add-complaint", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(complaintData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Complaint added successfully!");
            document.getElementById("name").value = '';
            document.getElementById("date").value = '';
        } else {
            alert("Failed to add complaint. Please try again.");
        }
    })
    .catch(error => {
        console.error("Error adding complaint:", error);
        alert("There was an error adding the complaint. Please try again later.");
    });
}

</script>
