  <script>
    // Function to fetch supplier data from the server
    async function fetchSupplierData() {
        try {
            let response = await fetch("http://localhost:8080/get-supplier");
            if (!response.ok) {
                throw new Error("Network response was not ok");
            }
            let data = await response.json();

            if (Array.isArray(data) && data.length > 0) {
                let tableBody = document.querySelector("#supplierTable tbody");
                tableBody.innerHTML = "";

                data.forEach(supplier => {
                    let row = document.createElement("tr");

                    let idCell = document.createElement("td");
                    idCell.textContent = supplier.id;
                    row.appendChild(idCell);

                    let nameCell = document.createElement("td");
                    nameCell.textContent = supplier.name;
                    row.appendChild(nameCell);

                    let addressCell = document.createElement("td");
                    addressCell.textContent = supplier.address;
                    row.appendChild(addressCell);

                    let contactCell = document.createElement("td");
                    contactCell.textContent = supplier.mobile;
                    row.appendChild(contactCell);

                    let emailCell = document.createElement("td");
                    emailCell.textContent = supplier.email;
                    row.appendChild(emailCell);

                    let cityCell = document.createElement("td");
                    cityCell.textContent = supplier.city;
                    row.appendChild(cityCell);

                    let passwordCell = document.createElement("td");
                    passwordCell.textContent = supplier.password;
                    row.appendChild(passwordCell);

                    // Create a delete button
                    let deleteCell = document.createElement("td");
                    let deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.classList.add("btn", "btn-danger");
                    deleteButton.onclick = () => deleteSupplier(supplier.id);
                    deleteCell.appendChild(deleteButton);
                    row.appendChild(deleteCell);

                    tableBody.appendChild(row);
                });
            } else {
                console.log("No supplier data found.");
            }
        } catch (error) {
            console.error("Error fetching supplier data: ", error);
        }
    }

    // Function to delete a supplier
    async function deleteSupplier(id) {
        if (confirm("Are you sure you want to delete this supplier?")) {
            try {
                let response = await fetch(`http://localhost:8080/delete-supplier/${id}`, {
                    method: "DELETE",
                });

                if (response.ok) {
                    alert("Supplier deleted successfully.");
                    fetchSupplierData(); // Refresh the table after deletion
                } else {
                    alert("Failed to delete supplier.");
                }
            } catch (error) {
                console.error("Error deleting supplier:", error);
                alert("An error occurred while deleting the supplier.");
            }
        }
    }

    // Call the fetchSupplierData function when the page loads
    window.onload = fetchSupplierData;
  </script>
