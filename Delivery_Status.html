<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta name="author" content="Dashboard">
  <meta name="keyword" content="Dashboard, Bootstrap, Admin, Template, Theme, Responsive, Fluid, Retina">
  <title>Free Feast</title>

  <!-- Favicons -->
  <link href="img/256x256bb.jpg" rel="icon">
  <link href="img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Bootstrap core CSS -->
  <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <!--external css-->
  <link href="lib/font-awesome/css/font-awesome.css" rel="stylesheet" />
  <!-- Custom styles for this template -->
  <link href="style.css" rel="stylesheet">
  <link href="style-responsive.css" rel="stylesheet">

  <style>
    body {
      color: #797979;
      background: url("img/8.jpg") no-repeat top;
      background-size: cover;
      font-family: 'Ruda', sans-serif;
      padding: 0px !important;
      margin: 0px !important;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <section id="container">
    <!-- Header -->
    <header class="header black-bg">
      <div class="sidebar-toggle-box">
        <div class="fa fa-bars tooltips" data-placement="right" data-original-title="Toggle Navigation"></div>
      </div>
      <a href="SupplierPanel.html" class="logo"><b>Free<span> Feast</span></b></a>
      <div class="top-menu">
        <ul class="nav pull-right top-menu">
          <li>
            <a class="logout" href="home.html">Logout</a>
          </li>
        </ul>
      </div>
    </header>

    <!-- Sidebar -->
    <aside>
      <div id="sidebar" class="nav-collapse">
        <ul class="sidebar-menu" id="nav-accordion">
            <li>
                <a  href="viewSchool.html"><i class="fa fa-table fa-3x"></i>View School</a>
                </li>
               <li>
                    <a  href="viewMeal.html"><i class="fa fa-table fa-3x"></i>View Meal</a>
                </li>
                
                 <li>
                    <a  href="addSupplier.html"><i class="fa fa-edit fa-3x"></i>Add Supplier</a>
                </li>
                <li>
                    <a  href="viewSupplier.html"><i class="fa fa-table fa-3x"></i>View Supplier</a>
                </li>
                <li class="nav-label"> Assign requirements Status</li>
                <li>
                    <a class="has-arrow" href="javascript:void()" aria-expanded="false">
                        <i class="icon-note menu-icon"></i><span class="nav-text">Operations</span>
                    </a>
                    <ul aria-expanded="false">
                        <li><a href="Delivery_Status.html">Delivery Status</a>
                        
                    </ul>
                </li>
                <li>
                    <a  href="viewComplaints.html"><i class="fa fa-table fa-3x"></i>View Complaints</a>
                </li>
                
                </ul>
</li>
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <section id="main-content">
      <section class="wrapper">
        <h3><i class="fa fa-angle-right"></i> Assigned Meal Request Status</h3>

        <div class="row mt">
          <div class="col-lg-12" align="center">
            <h4 style="color:white"><i class="fa fa-angle-right"></i> Assigned Request Status</h4>
            <div class="form-panel">
              <div class="form">
                <table class="table table-bordered table-striped" id="assignedRequestsTable">
                  <thead>
                    <tr>
                      <th>Id</th>
                      <th>Food Item</th>
                      <th>Quantity</th>
                      <th>Measure</th>
                      <th>School Name</th>
                      <th>Supplier Name</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Data will be dynamically injected here -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </section>

  <!-- JS Scripts -->
  <script src="lib/jquery/jquery.min.js"></script>
  <script src="lib/bootstrap/js/bootstrap.min.js"></script>
  <script class="include" type="text/javascript" src="lib/jquery.dcjqaccordion.2.7.js"></script>
  <script src="lib/jquery.scrollTo.min.js"></script>
  <script src="lib/jquery.nicescroll.js" type="text/javascript"></script>
  <script src="lib/common-scripts.js"></script>

  <script>
    // Function to fetch assigned requests and populate the table
    async function fetchAssignedRequests() {
      try {
        let response = await fetch("http://localhost:8080/get-assigned-requests");
        if (!response.ok) throw new Error("Failed to fetch assigned requests");

        let data = await response.json();
        let tableBody = document.querySelector("#assignedRequestsTable tbody");
        tableBody.innerHTML = ""; // Clear the table before populating it

        data.forEach(request => {
          let row = document.createElement("tr");

          row.innerHTML = `
            <td>${request.id}</td>
            <td>${request.food_Item}</td>
            <td>${request.quantity}</td>
            <td>${request.measure}</td>
            <td>${request.school_Name}</td>
            <td>${request.supplier_name}</td>
            <td>${request.status}</td>
          `;

          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error("Error fetching assigned requests:", error);
      }
    }

    // Initialize the page by fetching assigned requests
    window.onload = fetchAssignedRequests;
  </script>
</body>

</html>
