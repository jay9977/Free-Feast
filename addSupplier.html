    <section id="main-content">
      <section class="wrapper">
        <h3><i class="fa fa-angle-right"></i>Add Supplier</h3>
        
        <div class="row mt">
          <div class="col-lg-8" align="center">
            <h4 style="color:white"><i class="fa fa-angle-right"></i> Fill Information In Form</h4>
            <div class="form-panel">
              <div class="form">
                <form class="cmxform form-horizontal style-form" id="SupplierForm" method="post" action="addSupplier" align="center">
                  <div class="form-group">
                    <label for="schoolname" class="control-label col-lg-2">Supplier Name</label>
                    <div class="col-lg-10">
                      <input class=" form-control" id="name" name="name" placeholder="Enter Supplier Name" type="text" required/>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="address" class="control-label col-lg-2">Address</label>
                    <div class="col-lg-10">
                      <input class=" form-control" id="address" name="address" placeholder="Enter Address" type="text" required />
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="contact" class="control-label col-lg-2">Contact</label>
                    <div class="col-lg-10">
                      <input class="form-control " id="mobile" name="mobile" placeholder="Enter Mobile Number" onkeypress="return isNumberKey(event)"  minlength="10" maxlength="10" required/>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="password" class="control-label col-lg-2">Email</label>
                    <div class="col-lg-10">
                      <input class="form-control " id="email" name="email" placeholder="Enter Email" type="text" required />
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="password" class="control-label col-lg-2">Password</label>
                    <div class="col-lg-10">
                      <input class="form-control " id="password" name="password" placeholder="Enter Password" type="password" minlength="5" maxlength="20" required/>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="city" class="control-label col-lg-2">City</label>
                    <div class="col-lg-10">
                      <input class="form-control " id="city" name="city" placeholder="Enter City" type="text" />
                    </div>
                  </div>
                  <div class="form-group">
                    <div class="col-lg-offset-2 col-lg-10">
                      <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>

  <script src="lib/jquery/jquery.min.js"></script>
  <script src="lib/bootstrap/js/bootstrap.min.js"></script>
  <script src="lib/jquery.dcjqaccordion.2.7.js"></script>
  <script src="lib/jquery.scrollTo.min.js"></script>
  <script src="lib/jquery.nicescroll.js"></script>
  <script src="lib/common-scripts.js"></script>

  <!-- JavaScript for add supplier in database -->
  <script>
    document.getElementById("SupplierForm").addEventListener("submit", async function (event) {
      event.preventDefault(); // Prevent default form submission

      // Collect form data
      const formData = {
        name: document.getElementById("name").value,
        address: document.getElementById("address").value,
        mobile: document.getElementById("mobile").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value, // Corrected field name
        city: document.getElementById("city").value,
      };

      try {
        const response = await fetch("http://localhost:8080/add-supplier", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(formData),
        });

        if (response.ok) {
          alert("Supplier added successfully!");
          document.getElementById("SupplierForm").reset(); // Clear the form
          const result = await response.json();
          console.log("Success:", result);
        } else {
          alert("Failed to add supplier. Check your input.");
          console.error("Error:", response.statusText);
        }
      } catch (error) {
        console.error("Error submitting form:", error);
        alert("An error occurred while submitting the form.");
      }
    });
  </script>
