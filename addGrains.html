                <form class="cmxform form-horizontal style-form" id="signupForm" method="post" action="addGrains" align="center">

        </select>
                    </div>
                  </div>
                  <div class="form-group ">
                    <label for="quantity" class="control-label col-lg-2">Quantity</label>

                      <input class=" form-control" id="quantity" name="q" placeholder="Enter quantity" type="number"   required />
                    </div>
                  </div>
           
                  <div class="form-group ">
                    <label for="unit" class="control-label col-lg-2">Measure/Unit</label>
                    <div class="col-lg-10">

						<option value='KG'>KG</option>
